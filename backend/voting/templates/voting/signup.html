<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up — Crowna</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 400px;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      h1 {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 1rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        margin-top: 0.25rem;
        box-sizing: border-box;
      }
      .helptext {
        font-size: 0.85rem;
        color: #666;
        display: block;
        margin-top: 0.25rem;
      }
      ul.errorlist {
        color: #b00;
        padding-left: 1.2rem;
        font-size: 0.9rem;
        margin: 0.25rem 0 0;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      .links {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    {% include "voting/_nav.html" %}
    <h1>Create your Crowna account</h1>

    <form method="post" novalidate>
      {% csrf_token %} {% if form.non_field_errors %}
      <div class="errorlist">{{ form.non_field_errors }}</div>
      {% endif %}

      <label>
        Username {{ form.username }} {% if form.username.errors %}{{
        form.username.errors }}{% endif %} {% if form.username.help_text %}<span
          class="helptext"
          >{{ form.username.help_text }}</span
        >{% endif %}
      </label>

      <label>
        Email {{ form.email }} {% if form.email.errors %}{{ form.email.errors
        }}{% endif %} {% if form.email.help_text %}<span class="helptext"
          >{{ form.email.help_text }}</span
        >{% endif %}
      </label>

      <label>
        Password {{ form.password1 }} {% if form.password1.errors %}{{
        form.password1.errors }}{% endif %} {% if form.password1.help_text
        %}<span class="helptext">{{ form.password1.help_text }}</span>{% endif
        %}
      </label>

      <label>
        Confirm password {{ form.password2 }} {% if form.password2.errors %}{{
        form.password2.errors }}{% endif %}
      </label>

      <button type="submit">Create account</button>
    </form>

    <p class="links">
      Already have an account? <a href="{% url 'voting:login' %}">Sign in</a>
    </p>
  </body>
</html>
