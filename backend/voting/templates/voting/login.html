<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in — Crowna</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 360px;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        margin: 0.25rem 0 0.75rem;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        cursor: pointer;
      }
      .err {
        color: #b00;
        margin-bottom: 1rem;
      }
      .links {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    {% include "voting/_nav.html" %}
    <h1>Sign in</h1>
    {% if form.errors %}
    <p class="err">Invalid username or password.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Username {{ form.username }} </label>
      <label>Password {{ form.password }} </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="links">
      No account? <a href="{% url 'voting:signup' %}">Sign up</a>
    </p>
  </body>
</html>
