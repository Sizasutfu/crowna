{% load static %}
<header class="site-nav">
  <div class="wrap nav-inner">
    <a href="{% url 'voting:home' %}" class="brand" aria-label="Crowna home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 24V11l6 5 6-9 6 9 6-5v13z"/>
        <path d="M4 27h24"/>
      </svg>
      Crowna
    </a>
    <nav class="nav-links">
      <a href="{% url 'voting:contest_list' %}">Contests</a>
      {% if user.is_authenticated %}
        <span class="who">Signed in as <strong>{{ user.username }}</strong></span>
        <form method="post" action="{% url 'voting:logout' %}">
          {% csrf_token %}
          <button type="submit" class="link-btn">Log out</button>
        </form>
      {% else %}
        <a class="signin" href="{% url 'voting:login' %}">Sign in</a>
        <a class="signup" href="{% url 'voting:signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </div>
</header>
